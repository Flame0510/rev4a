name: Build and Publish Agent Base Image

on:
  push:
    branches: [main]
    paths:
      - 'agent-templates/base-image/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo
        id: vars
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent base image
        uses: docker/build-push-action@v6
        with:
          context: agent-templates/base-image
          file: agent-templates/base-image/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.repo }}/openclaw-agent-base:latest
