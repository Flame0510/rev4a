name: Build and Publish Agent Base Image

# The image is published under its OpenClaw version, never as :latest by default.
#
# Rev4a creates and recreates agents from their version tag. Moving to a new OpenClaw
# release migrates an agent's data one way: the old release refuses the migrated
# database. Publishing :latest on every push would put anyone running the image by hand
# on the new release before they chose to. So :latest moves only when this
# workflow is run by hand with promote_latest; it is for people running the image
# themselves, never for Rev4a.
#
# Tags:
#   :<version>          the OpenClaw release in the Dockerfile (ARG OPENCLAW_VERSION);
#                       moves when the image is rebuilt for the same release
#   :<version>-<sha>    immutable, one per commit
#   :latest             only with promote_latest
#
# Every tag is ONE multi-arch manifest list (linux/amd64 + linux/arm64). Each platform
# is built natively on its own runner (no QEMU) and pushed by digest; the merge job
# then creates the manifest list for every tag. Rev4a pulls by tag and docker picks the
# host's platform; the revision label is baked into both images.

on:
  push:
    branches: [main]
    paths:
      - 'agent-templates/base-image/**'
  workflow_dispatch:
    inputs:
      version:
        description: "OpenClaw version to build instead of the Dockerfile ARG (e.g. 2026.7.1-2, to publish an older tag)"
        required: false
        type: string
      retag_latest_as:
        description: "Publish the existing :latest image under this version tag, without building (e.g. 2026.7.1-2)"
        required: false
        type: string
      promote_latest:
        description: "Also tag this build as :latest for people running the image by hand (Rev4a never uses it)"
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repo: ${{ steps.vars.outputs.repo }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.tags.outputs.revision }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo for ghcr.io
        id: vars
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repo=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve the OpenClaw version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A manual run may name a version (to publish an older tag, e.g. the one a
          # rollback needs); otherwise the Dockerfile's ARG is the source of truth.
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^ARG OPENCLAW_VERSION=//p' agent-templates/base-image/Dockerfile | head -1)"
          fi
          # The WHOLE string must match (grep -E checks line by line, so a second line would pass),
          # and a newline is refused outright: the value reaches $GITHUB_OUTPUT.
          NL=$'\n'
          if [[ "$VERSION" == *"$NL"* ]] || [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the OpenClaw version is missing or malformed"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        env:
          REPO: ${{ steps.vars.outputs.repo }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          BASE="ghcr.io/${REPO}/openclaw-agent-base"
          TAGS="${BASE}:${VERSION},${BASE}:${VERSION}-${GITHUB_SHA::7}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PROMOTE_LATEST" = "true" ]; then
            TAGS="${TAGS},${BASE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          # The same short sha as the immutable tag; baked in as the revision label.
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

  # One native build per platform, pushed by digest only (no tag yet).
  build:
    needs: prepare
    if: inputs.retag_latest_as == ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_ACTIONS_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: agent-templates/base-image
          file: agent-templates/base-image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            OPENCLAW_VERSION=${{ needs.prepare.outputs.version }}
            IMAGE_REVISION=${{ needs.prepare.outputs.revision }}
          outputs: type=image,name=ghcr.io/${{ needs.prepare.outputs.repo }}/openclaw-agent-base,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-platform images into one manifest list under every tag.
  merge:
    needs: [prepare, build]
    if: inputs.retag_latest_as == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_ACTIONS_TOKEN }}

      - name: Create the manifest list for every tag
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE: ghcr.io/${{ needs.prepare.outputs.repo }}/openclaw-agent-base
        run: |
          set -euo pipefail
          SOURCES=""
          for d in *; do SOURCES="$SOURCES ${IMAGE}@sha256:$d"; done
          [ "$(echo $SOURCES | wc -w)" -eq 2 ] || { echo "::error::expected 2 platform digests, found: $SOURCES"; exit 1; }
          TAGARGS=""
          IFS=',' read -ra T <<< "$TAGS"
          for t in "${T[@]}"; do TAGARGS="$TAGARGS -t $t"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGARGS $SOURCES

      - name: Inspect the result
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra T <<< "$TAGS"
          for t in "${T[@]}"; do docker buildx imagetools inspect "$t"; done

  # A release that predates the version ARG has only :latest on ghcr; a rollback
  # needs its :<version> tag, so this republishes the existing image under it.
  # imagetools copies the whole manifest list, so no platform is lost (a pull, tag
  # and push would keep only the runner's own).
  retag:
    needs: prepare
    if: inputs.retag_latest_as != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_ACTIONS_TOKEN }}

      - name: Retag :latest as a version (no build)
        env:
          V: ${{ inputs.retag_latest_as }}
          BASE: ghcr.io/${{ needs.prepare.outputs.repo }}/openclaw-agent-base
        run: |
          set -euo pipefail
          NL=$'\n'
          if [[ "$V" == *"$NL"* ]] || [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::retag_latest_as is malformed"
            exit 1
          fi
          docker buildx imagetools create -t "${BASE}:${V}" "${BASE}:latest"
          docker buildx imagetools inspect "${BASE}:${V}"
