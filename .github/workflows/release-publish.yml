name: Release NPM Publish

# The version published to npm is ALWAYS the GitHub release tag.
# No trigger on push: publishing is an explicit act (release or dispatch),
# never a side effect of a commit.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.11). Empty = use package.json"
        required: false
        type: string
      dry_run:
        description: "Dry run only, without publishing for real"
        required: false
        type: boolean
        default: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (the release tag, or the dispatch ref)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Resolve and validate the version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
            if [ -z "$RAW" ]; then RAW="$(node -p "require('./package.json').version")"; fi
          fi
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version: '$RAW'. Expected the form vX.Y.Z."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm ci before the bump: the lockfile stays the committed one.
      - name: Install
        run: npm ci

      - name: Align package.json with the release version
        run: npm version "${{ steps.resolve.outputs.version }}" --no-git-tag-version --allow-same-version

      # Gate: no build, no publish.
      - name: Check the language (100% English)
        run: node scripts/check-language.mjs

      - name: Build
        run: npm run build

      - name: Check whether the version is already on npm
        id: exists
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG@${{ steps.resolve.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$PKG@${{ steps.resolve.outputs.version }} already exists on npm — publish skipped."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # A release always publishes for real. The dry run exists only for the
      # manual dispatch, where it is also the default.
      - name: Publish (dry run)
        if: steps.exists.outputs.already == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run

      - name: Publish
        if: steps.exists.outputs.already == 'false' && (github.event_name == 'release' || !inputs.dry_run)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Carry the published version back into main, so the repo and the registry
  # can no longer drift apart silently.
  sync-version:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Align package.json on the default branch
        run: |
          set -euo pipefail
          VERSION="${{ needs.publish.outputs.version }}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json is already at $VERSION — nothing to do."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align package.json with v$VERSION [skip ci]"
          git push
