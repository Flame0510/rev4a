name: Release NPM Publish

# The version published to npm is ALWAYS the GitHub release tag.
# No trigger on push: publishing is an explicit act (release or dispatch),
# never a side effect of a commit.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.11). Empty = use package.json"
        required: false
        type: string
      dry_run:
        description: "Dry run only, without publishing for real"
        required: false
        type: boolean
        default: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The job only reads the repository; it never writes through GITHUB_TOKEN.
    # npm publishes through Trusted Publishing: npm trusts this workflow file of this
    # repository (configured once on npmjs.com, package settings) and exchanges the
    # job's OIDC token for a short-lived publish token, so no npm token is stored here.
    # id-token: write lets the job request that OIDC token; it grants nothing else.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (the release tag, or the dispatch ref)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          # The token is not needed after checkout; keep it out of .git/config while
          # npm ci runs third-party install scripts.
          persist-credentials: false

      # Event values come in through env, never pasted into the script: a tag name or a
      # dispatch input is text someone typed, and is only validated below.
      - name: Resolve and validate the version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$RELEASE_TAG"
          else
            RAW="$INPUT_VERSION"
            if [ -z "$RAW" ]; then RAW="$(node -p "require('./package.json').version")"; fi
          fi
          VERSION="${RAW#v}"
          # A newline or a carriage return would let the value inject extra lines into
          # $GITHUB_OUTPUT, so refuse it before anything is written there.
          if [[ "$VERSION" == *$'\n'* || "$VERSION" == *$'\r'* ]]; then
            # The rejected value is not echoed: a second line could carry a workflow command.
            echo "::error::Invalid version: it contains a newline or carriage return."
            exit 1
          fi
          # grep matches per line, so the old '^...$' check was not a whole-string match:
          # "1.2.3\nfoo" passed it. This bash regex anchors ^ and $ to the whole string.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version. Expected the form vX.Y.Z (any v prefix is stripped)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm ci before the bump: the published dependency tree stays committed.
      - name: Install
        run: npm ci
        env:
          REV4A_SKIP_POSTINSTALL_BUILD: '1'

      - name: Align package.json with the release version
        run: npm version "${{ steps.resolve.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Check the language (100% English)
        run: node scripts/check-language.mjs

      - name: Typecheck the npm tarball under node_modules
        run: npm run check:package-types

      # Gate: no build, no publish.
      - name: Build
        run: npm run build

      - name: Check whether the version is already on npm
        id: exists
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG@${{ steps.resolve.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$PKG@${{ steps.resolve.outputs.version }} already exists on npm — publish skipped."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Installed only
      # here, after npm ci and the build, so the dependency install keeps the npm that
      # ships with Node.
      - name: Install an npm that supports Trusted Publishing
        if: steps.exists.outputs.already == 'false'
        run: npm install -g npm@11.21.2

      # A release always publishes for real. The dry run exists only for the
      # manual dispatch, where it is also the default.
      - name: Publish (dry run)
        if: steps.exists.outputs.already == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run

      - name: Publish
        if: steps.exists.outputs.already == 'false' && (github.event_name == 'release' || !inputs.dry_run)
        # No NODE_AUTH_TOKEN: npm authenticates through OIDC (see the permissions above).
        # On a public repository npm also attaches provenance on its own.
        run: npm publish --access public

  # Carry the published version back into main, so the repo and the registry
  # can no longer drift apart silently.
  sync-version:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Align package.json on the default branch
        run: |
          set -euo pipefail
          VERSION="${{ needs.publish.outputs.version }}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json is already at $VERSION — nothing to do."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json npm-shrinkwrap.json
          git commit -m "chore: align package.json with v$VERSION [skip ci]"
          git push
