name: Publish npm Package

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bin/**'
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'agent-templates/**'
      - 'daemon.js'
      - 'lineage.js'
      - 'proxy.ts'
      - 'next.config.mjs'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate with GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=$NPM_TOKEN" > ~/.npmrc
          echo "@flame0510:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          NPM_TOKEN: *** secrets.GH_ACTIONS_TOKEN }}

      - run: npm ci
      - run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NPM_TOKEN: *** secrets.GH_ACTIONS_TOKEN }}
