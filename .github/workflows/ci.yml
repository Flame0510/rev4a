name: CI

# The gates that used to run only at release time (release-publish.yml), moved in front
# of main: a regression that breaks the build, the types or the 100% English rule is
# caught on the pull request instead of when a version is being published.
#
# The release workflow keeps its own copies of these steps on purpose — it is the last
# gate before npm, and it must not depend on this one having run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: this job only checks out, installs and builds.
permissions:
  contents: read

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The token is not needed after checkout; keep it out of .git/config while
          # dependency install scripts run.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The build is its own step below; without this, bin/postinstall.js would run a
      # full `next build` during `npm ci`, before the language check, and the build
      # would then run a second time.
      - name: Install
        run: npm ci
        env:
          REV4A_SKIP_POSTINSTALL_BUILD: '1'

      # Cheapest gate first: it needs no build output and names the offending line.
      - name: Check the language (100% English)
        run: npm run check:language

      - name: Typecheck
        run: npm run typecheck

      # Every scripts/test-*.mjs and test-*.sh in its own process (scripts/run-tests.mjs).
      # No Docker, no network, no running instance.
      - name: Test
        run: npm test

      - name: Typecheck the npm tarball under node_modules
        run: npm run check:package-types

      - name: Build
        run: npm run build
