name: Release npm Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write .npmrc
        run: |
          echo "@flame0510:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$TOKEN" >> ~/.npmrc
        env:
          TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
