# Rev4a Traefik — dedicated reverse proxy
#
# This Traefik instance is isolated from any other Traefik running on the host.
# It uses its own Docker network (rev4a-traefik) and config directory.
#
# Ports:
#   80  → HTTP  (entrypoint: web)
#   443 → HTTPS (entrypoint: websecure)
#   8080 → Dashboard (internal only, not exposed)

services:
  traefik:
    image: traefik:latest
    container_name: traefik-'rev4a'
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - rev4a-traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs
    labels:
      - "traefik.enable=false"

networks:
  rev4a-traefik:
    name: rev4a-traefik
    external: true  # created by setup.sh before this Compose stack starts
